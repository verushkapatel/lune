# The evaluation Worker (eval-worker.js). Deployed and deleted by .github/workflows/eval-lune-ai.yml.
name = "lune-ai-eval"
main = "eval-worker.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[vars]
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MODEL_FALLBACK = "@cf/meta/llama-3.1-8b-instruct-fast"
STT_MODEL = "@cf/openai/whisper-large-v3-turbo"
TTS_MODEL = "@cf/myshell-ai/melotts"
