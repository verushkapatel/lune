# Deploys Lune AI (workers/lune-ai) to Cloudflare Workers, from GitHub's servers.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Runs when the Worker changes, or by hand from the Actions tab.
name: Deploy Lune AI

on:
  push:
    branches: [main, claude/exciting-cori-mkxrlm]
    paths:
      - "workers/lune-ai/**"
      - ".github/workflows/deploy-lune-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the Worker
        run: node workers/lune-ai/test.mjs

      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN secret (Settings, Secrets and variables, Actions)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID secret (Settings, Secrets and variables, Actions)"; exit 1; }

      - name: Deploy to Cloudflare
        id: deploy
        working-directory: workers/lune-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx -y wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::No workers.dev address in the deploy output. Open Workers & Pages in the Cloudflare dashboard once so it sets up your workers.dev subdomain, then run this again."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check it answers
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS "${{ steps.deploy.outputs.url }}/health" | tee health.json | grep -q '"ok":true'; then
              echo "LUNE_AI_URL=${{ steps.deploy.outputs.url }}"
              echo "Lune AI is live at ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${{ steps.deploy.outputs.url }}/health did not answer"; exit 1
